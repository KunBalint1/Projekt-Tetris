<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Tetris játék</title>
</head>

<body class="p-5 text-white">
    <div class="jatekOldal container">
        <header class="text-center p-5">
            <h1>Üdvözöljük a Tetris játékban!</h1>
        </header>

        <main>
            <section class="text-center py-5">
                <div class="container">
                    <div class="row text-center">
                        <div class="col-6">
                            <canvas id="myCanvas" class="jatekCanvas" width="600" height="800"
                                style="border: 1px solid #000;"></canvas>
                        </div>
                        <div class="col-6">
                            <div class="card border-0 text-white h-100">
                                <div class="card-body">
                                    <h5 class="card-title">Statisztika</h5>
                                    <div class="row g-3">
                                        <div class="col-12 col-sm-6">
                                            <div class="card h-100">
                                                <div class="card-body text-white">
                                                    <h6 class="card-title fw-bold">Pontszám</h6>
                                                    <p class="card-text small"><span class="pont">0</span></p>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="col-12 col-sm-6">
                                            <div class="card h-100">
                                                <div class="card-body text-white">
                                                    <h6 class="card-title fw-bold">Rekord</h6>
                                                    <p class="card-text small"><span class="rekord">0</span></p>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="card">
                                                <div class="card-body">
                                                    <h6 class="card-title fw-bold text-white p-3">Fejlesztések</h6>
                                                    <div class="row g-3">
                                                        <div class="col-12">
                                                            <button type="button"
                                                                class="btn sorBonuszGomb w-75">Sor-bónusz (300
                                                                pont)</button>
                                                        </div>
                                                        <div class="col-12">
                                                            <button type="button" class="btn szorzoGomb w-75">Szorzó
                                                                fejlesztés (500
                                                                pont)</button>
                                                        </div>
                                                        <div class="col-12">
                                                            <button type="button" class="btn lassitasGomb w-75">Lassítás
                                                                (500
                                                                pont)</button>
                                                        </div>
                                                        <div class="col-12">
                                                            <button type="button"
                                                                class="btn kockaCsereGomb w-75">Kockacsere (700
                                                                pont)</button>
                                                        </div>
                                                        <div class="col-12">
                                                            <button type="button" class="btn mentesGomb w-75">Vészmentés
                                                                (1000
                                                                pont)</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="card">
                                                <div class="card-body">
                                                    <h6 class="card-title fw-bold text-white">Irányítás</h6>
                                                    <div class="col-12 mt-4">
                                                        <div
                                                            class="iranyitas d-flex flex-wrap justify-content-center gap-2">
                                                            <span class="btn border-0" title="Mozgás balra">
                                                                <i class="bi bi-arrow-left"></i>
                                                                <small>Balra</small>
                                                            </span>
                                                            <span class="btn border-0" title="Mozgás lefelé">
                                                                <i class="bi bi-arrow-down"></i>
                                                                <small>Le</small>
                                                            </span>
                                                            <span class="btn border-0" title="Mozgás jobbra">
                                                                <i class="bi bi-arrow-right"></i>
                                                                <small>Jobbra</small>
                                                            </span>
                                                            <span class="btn border-0" title="Forgatás: fel nyíl">
                                                                <i class="bi bi-arrow-up"></i>
                                                                <small>Forgatás</small>
                                                            </span>
                                                            <span class="btn border-0" title="Azonnali lerakás: szóköz">
                                                                <kbd>Space</kbd>
                                                                <small>Lerakás</small>
                                                            </span>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-12 col-sm-6">
                                            <button type="button" class="btn btn-lg ujraGomb">Újrakezdés</button>
                                        </div>

                                        <div class="col-12 col-sm-6">
                                            <button type="button" class="btn btn-lg szunetGomb">Szünet</button>
                                        </div>
                                        <div class="pt-5">
                                            <a href="index.html"><button type="button" class="btn btn-lg"
                                                    target="_blank">Vissza a
                                                    főoldalra</button></a>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
            </section>
        </main>

        <footer class="text-center p-5">
            <p>2026 &copy; Minden jog fenntartva! &bull; bankitatabanya.hu</p>
        </footer>

        <div class="toast-container position-fixed bottom-5 end-0 p-3" style="height: 5%;">
            <div id="gameToast" class="toast text-bg-info text-white border-0" role="alert" aria-live="assertive"
                aria-atomic="true">
                <div class="d-flex">
                    <div class="toast-body"></div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                        aria-label="Bezárás"></button>
                </div>
            </div>
        </div>
    </div>


    <script src="js/bootstrap.min.js"></script>
    <script src="js/Jatek.js"></script>
    <script src="js/Mozgatas.js"></script>
    <script src="js/blokk.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
